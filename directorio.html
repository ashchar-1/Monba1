        :root {
            --color-primario: #0077b6;
            --color-secundario: #00b4d8;
            --color-arena: #fefae0;
            --color-texto: #333333;
            --color-blanco: #ffffff;
            --color-gris: #f4f4f4;
            --color-exito: #25D366;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--color-gris); color: var(--color-texto); overflow-x: hidden; }

        /* =========================================
           ENCABEZADO
           ========================================= */
        header {
            background-color: var(--color-primario); color: var(--color-blanco);
            padding: 15px 20px; display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .btn-volver { color: white; text-decoration: none; font-size: 1.2rem; cursor: pointer; border: none; background: none;}
        header h1 { font-size: 1.2rem; margin: 0 auto; padding-right: 15px;}

        /* =========================================
           CARRUSEL (SOLO MODO DETALLE)
           ========================================= */
        .carrusel-contenedor {
            position: relative;
            width: 100%;
            height: 35vh;
            background-color: #ddd;
        }
        .carrusel-slides {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            height: 100%;
            -webkit-overflow-scrolling: touch;
        }
        .carrusel-slides::-webkit-scrollbar { display: none; }
        .carrusel-slides { -ms-overflow-style: none; scrollbar-width: none; }

        .slide {
            flex: 0 0 100%;
            height: 100%;
            scroll-snap-align: start;
            background-size: cover;
            background-position: center;
        }

        .btn-carrusel {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 10;
            display: flex; justify-content: center; align-items: center;
        }
        .btn-prev { left: 10px; }
        .btn-next { right: 10px; }

        /* =========================================
           INFORMACIÓN (MODO DETALLE)
           ========================================= */
        .info-seccion {
            background-color: var(--color-blanco);
            padding: 20px;
            margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .info-seccion h2 { color: var(--color-primario); font-size: 1.5rem; margin-bottom: 5px; }
        .ubicacion { color: #777; font-size: 0.9rem; margin-bottom: 15px; display: flex; align-items: center; gap: 5px; }
        .descripcion { font-size: 0.95rem; line-height: 1.6; text-align: justify; margin-bottom: 15px; }

        .servicios-tags {
            display: flex; flex-wrap: wrap; gap: 8px;
        }
        .tag {
            background-color: var(--color-arena);
            color: var(--color-primario);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            display: flex; align-items: center; gap: 5px;
            border: 1px solid #e9e5c4;
        }

        /* =========================================
           BANNER COQUETO A RESTAURANTE.HTML
           ========================================= */
        .banner-restaurante {
            margin: 20px 15px;
            background: linear-gradient(135deg, var(--color-secundario), var(--color-primario));
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(0, 119, 182, 0.3);
            transition: transform 0.2s;
        }
        .banner-restaurante:active { transform: scale(0.98); }
        .banner-restaurante a {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
        }
        .banner-restaurante i {
            font-size: 2rem;
            background: rgba(255,255,255,0.2);
            padding: 12px;
            border-radius: 50%;
        }
        .banner-restaurante span {
            flex: 1;
            margin: 0 15px;
            text-align: center;
            line-height: 1.4;
        }

        /* =========================================
           LISTA DE LUGARES (MODO DIRECTORIO)
           ========================================= */
        .lista-lugares {
            padding: 20px 15px;
        }
        .lista-lugares h3 {
            font-size: 1.2rem; margin-bottom: 15px; color: var(--color-texto);
            border-bottom: 2px solid var(--color-primario); padding-bottom: 5px; display: inline-block;
        }

        .tarjeta-lugar {
            background-color: var(--color-blanco);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-left: 4px solid var(--color-secundario);
            text-decoration: none;
            color: var(--color-texto);
        }
        .tarjeta-lugar h4 {
            color: var(--color-primario);
            font-size: 1.1rem;
        }
        .tarjeta-lugar p {
            font-size: 0.9rem;
            color: #555;
            line-height: 1.4;
        }

        /* =========================================
           DIRECTORIO COMERCIOS (DENTRO DEL DETALLE)
           ========================================= */
        .directorio-seccion {
            padding: 20px 15px;
        }
        .directorio-seccion h3 {
            font-size: 1.2rem; margin-bottom: 15px; color: var(--color-texto);
            border-bottom: 2px solid var(--color-primario); padding-bottom: 5px; display: inline-block;
        }

        .tarjeta-comercio {
            background-color: var(--color-blanco);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.08);
            border-left: 4px solid var(--color-secundario);
        }
        .comercio-header {
            display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px;
        }
        .comercio-nombre { font-size: 1.1rem; font-weight: bold; color: var(--color-primario); }
        .comercio-precio { background-color: #e8f5e9; color: #2e7d32; padding: 4px 8px; border-radius: 6px; font-weight: bold; font-size: 0.9rem;}
        
        .comercio-desc { font-size: 0.9rem; color: #555; margin-bottom: 12px; }
        
        .btn-contacto {
            display: inline-flex; justify-content: center; align-items: center; gap: 8px;
            background-color: var(--color-exito); color: white;
            text-decoration: none; padding: 8px 15px; border-radius: 8px;
            font-size: 0.9rem; font-weight: bold; width: 100%;
        }

        /* =========================================
           BARRA DE ACCIONES
           ========================================= */
        .barra-acciones {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .btn-accion {
            background: none;
            border: none;
            color: var(--color-primario);
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-accion i {
            font-size: 1.3rem;
            color: var(--color-secundario);
            background-color: var(--color-arena);
            padding: 10px;
            border-radius: 50%;
        }
        .btn-accion:active i { transform: scale(0.9); }

        /* =========================================
           BOTÓN DESCARGAR CARTEL QR
           ========================================= */
        .zona-qr {
            text-align: center; padding: 20px 15px 40px 15px;
        }
        .btn-qr {
            background-color: var(--color-texto); color: var(--color-arena);
            border: none; padding: 15px 20px; border-radius: 10px;
            font-size: 1rem; font-weight: bold; cursor: pointer; width: 100%;
            display: flex; justify-content: center; align-items: center; gap: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .btn-qr:active { transform: scale(0.98); }

        /* MODAL QR */
        .modal-qr {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            align-items: center;
            justify-content: center;
            z-index: 200;
        }
        .modal-qr.activo { display: flex; }
        .contenido-qr {
            background: white;
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            max-width: 300px;
            width: 90%;
        }
        .contenido-qr img {
            width: 200px;
            height: 200px;
            margin: 15px 0;
        }
        .btn-cerrar-qr {
            background: var(--color-primario);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

        </div>

        <!-- Zona QR común -->
        <div class="zona-qr">
            <button class="btn-qr" onclick="alert('Descargando cartel QR en formato PDF...')">
                <i class="fa-solid fa-qrcode"></i> Descargar Cartel QR de este lugar

        </div>

        <!-- Modal QR -->
        <div class="modal-qr" id="modal-qr">
            <div class="contenido-qr">
                <h4>Escanea este código</h4>
                <img id="imagen-qr" src="" alt="Código QR">
                <br>
                <button class="btn-cerrar-qr" onclick="cerrarQR()">Cerrar</button>
            </div>
        </div>

    </main>

        // Parámetros de URL
        function obtenerParametroURL(nombre) {
            return new URLSearchParams(window.location.search).get(nombre);
                                     }
        // ============================================
        // LÓGICA PRINCIPAL
        // ============================================
        function cargarDirectorio() {
            const idLugar = obtenerParametroURL('id');
            const municipio = obtenerParametroURL('municipio');
            const categoria = obtenerParametroURL('categoria');
            
            const estado = document.getElementById('mensaje-estado');
            const principal = document.getElementById('contenido-principal');
            const vistaDetalle = document.getElementById('vista-detalle');
            const vistaLista = document.getElementById('vista-lista');

            // Configurar enlace del banner a restaurante.html
            const enlaceRest = document.getElementById('enlace-restaurante');
            enlaceRest.href = municipio ? `restaurante.html?municipio=${municipio}` : 'restaurante.html';

            // ---------- MODO DETALLE POR ID ----------
            if (idLugar) {
                // Buscar el lugar en todo el árbol
                let lugarEncontrado = null;
                for (const muni in lugaresDB) {
                    for (const cat in lugaresDB[muni]) {
                        const arr = lugaresDB[muni][cat];
                        const hallado = arr.find(p => p.id === idLugar);
                        if (hallado) {
                            lugarEncontrado = hallado;
                            break;
                        }
                    }
                    if (lugarEncontrado) break;
                }

                if (lugarEncontrado) {
                    document.getElementById('titulo-header').textContent = lugarEncontrado.nombre;
                    document.getElementById('lugar-nombre').textContent = lugarEncontrado.nombre;
                    document.getElementById('lugar-ubicacion').textContent = lugarEncontrado.ubicacion;
                    document.getElementById('lugar-descripcion').textContent = lugarEncontrado.descripcion;

                    // Imágenes carrusel
                    const contImg = document.getElementById('carrusel-imagenes');
                    contImg.innerHTML = lugarEncontrado.imagenes.map(img => 
                        `<div class="slide" style="background-image: url('${img}');"></div>`
                    ).join('');

                    // Servicios
                    const contServ = document.getElementById('contenedor-servicios');
                    contServ.innerHTML = lugarEncontrado.servicios.map(srv =>
                        `<span class="tag"><i class="fa-solid ${srv.icono}"></i> ${srv.nombre}</span>`
                    ).join('');

                    // Comercios
                    const contCom = document.getElementById('contenedor-comercios');
                    contCom.innerHTML = lugarEncontrado.comercios.map(com => {
                        const msg = encodeURIComponent(`Hola, vi tu servicio de ${com.producto} en Monbá QR.`);
                        return `
                        <div class="tarjeta-comercio">
                            <div class="comercio-header">
                                <span class="comercio-nombre">${com.negocio}</span>
                                <span class="comercio-precio">${com.precio}</span>
                            </div>
                            <p class="comercio-desc">Ofrece: ${com.producto}</p>
                            <a href="https://wa.me/${com.telefono}?text=${msg}" target="_blank" class="btn-contacto">
                                <i class="fa-brands fa-whatsapp"></i> Contactar
                            </a>
                        </div>`;
                    }).join('');

                    // Botón Ruta
                    document.getElementById('btn-ruta').onclick = () => window.open(lugarEncontrado.mapsNavegacion, '_blank');
                    document.getElementById('btn-compartir').onclick = compartir;
                    document.getElementById('btn-ver-qr').onclick = mostrarQR;

                    vistaDetalle.style.display = 'block';
                    vistaLista.style.display = 'none';
                } else {
                    document.getElementById('titulo-header').textContent = "No encontrado";
                    estado.innerHTML = `<i class="fa-solid fa-circle-xmark fa-2x"></i><p>Lugar no disponible.</p>`;
                    principal.style.display = 'block';
                    return;
                }
            }
            // ---------- MODO LISTA POR MUNICIPIO Y CATEGORÍA ----------
            else if (municipio && categoria) {
                const lugaresMunicipio = lugaresDB[municipio];
                if (lugaresMunicipio && lugaresMunicipio[categoria]) {
                    const lista = lugaresMunicipio[categoria];
                    document.getElementById('titulo-header').textContent = `${categoria.charAt(0).toUpperCase() + categoria.slice(1)} - ${municipio.replace(/-/g,' ')}`;
                    document.getElementById('titulo-lista').textContent = `Resultados para "${categoria}" en ${municipio.replace(/-/g,' ')}`;

                    const contLista = document.getElementById('contenedor-lista');
                    contLista.innerHTML = lista.map(lugar => `
                        <a href="directorio.html?id=${lugar.id}" class="tarjeta-lugar">
                            <h4>${lugar.nombre}</h4>
                            <p><i class="fa-solid fa-location-dot"></i> ${lugar.ubicacion}</p>
                            <p>${lugar.descripcion}</p>
                        </a>
                    `).join('');

                    vistaLista.style.display = 'block';
                    vistaDetalle.style.display = 'none';
                } else {
                    document.getElementById('titulo-header').textContent = "Sin resultados";
                    document.getElementById('titulo-lista').textContent = "No se encontraron lugares para esta categoría.";
                    document.getElementById('contenedor-lista').innerHTML = '';
                    vistaLista.style.display = 'block';
                    vistaDetalle.style.display = 'none';
                }
            } else {
                // Sin parámetros válidos
                document.getElementById('titulo-header').textContent = "Directorio";
                estado.innerHTML = `<i class="fa-solid fa-circle-info fa-2x"></i><p>Selecciona un municipio y categoría.</p>`;
                principal.style.display = 'block';
                return;
            }

            estado.style.display = 'none';
            principal.style.display = 'block';
        }

        // Carrusel manual
        function moverCarrusel(direccion) {
            const carrusel = document.getElementById('carrusel-imagenes');
            if (carrusel) {
                const ancho = carrusel.clientWidth;
                carrusel.scrollBy({ left: ancho * direccion, behavior: 'smooth' });
            }
        }

        // Compartir
        function compartir() {
            if (navigator.share) {
                navigator.share({
                    title: 'Monbá QR',
                    text: '¡Mira este destino en Barlovento!',
                    url: window.location.href
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(window.location.href)
                    .then(() => alert('Enlace copiado al portapapeles'))
                    .catch(() => alert('Copia este enlace: ' + window.location.href));
            }
        }

        // Modal QR
        function mostrarQR() {
            const modal = document.getElementById('modal-qr');
            const imagenQR = document.getElementById('imagen-qr');
            imagenQR.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(window.location.href)}`;
            modal.classList.add('activo');
        }

        function cerrarQR() {
            document.getElementById('modal-qr').classList.remove('activo');
        }

        document.getElementById('modal-qr').addEventListener('click', function(e) {
            if (e.target === this) cerrarQR();
        });

        document.addEventListener("DOMContentLoaded", cargarDirectorio);
    </script>
